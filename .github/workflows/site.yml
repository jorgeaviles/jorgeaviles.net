name: Site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      site-artifact-id: ${{ steps.site-artifact.outputs.artifact-id }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types and content
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run unit tests
        run: npm test
      - name: Verify draft publication boundaries
        run: npm run test:publication
      - name: Build
        run: npm run build
      - name: Identify the tested commit
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          await writeFile('dist/deployment.json', JSON.stringify({ commit: process.env.GITHUB_SHA }) + '\n');
          NODE
      - name: Install browser engines
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Run browser and accessibility tests
        run: npm run test:browser
      - name: Save browser report and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Save verified site
        id: site-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-site-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Production
    needs: quality
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked deployment tooling
        run: npm ci
      - name: Restore verified site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.quality.outputs.site-artifact-id }}
          merge-multiple: true
          digest-mismatch: error
          path: dist/
      - name: Verify artifact provenance
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const { commit } = JSON.parse(await readFile('dist/deployment.json', 'utf8'));
          if (commit !== process.env.GITHUB_SHA) throw new Error('Artifact does not match the tested commit.');
          NODE
      - name: Deploy the current main commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Skipping an older run because main has advanced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing production Cloudflare API token." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing production Cloudflare account ID." >&2; exit 1; }
          npx --no-install wrangler deploy --message "Commit ${GITHUB_SHA}"
          echo "Deployed tested commit ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Verify the public release
        if: steps.release.outputs.deployed == 'true'
        run: node scripts/smoke-production.mjs

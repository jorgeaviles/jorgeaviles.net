name: Portfolio API release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Release operation (never deploys static assets)
        type: choice
        options: [deploy, rollback]
        default: deploy
        required: true
      mcp_enabled:
        description: Target MCP flag (requires separately approved client verification)
        type: boolean
        default: false
      expected_current_mcp:
        description: Expected live MCP flag; stops if production has changed
        type: boolean
        default: false
      rollback_version:
        description: Exact previously deployed version UUID (rollback only)
        type: string

permissions:
  contents: read

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: verified-api-${{ github.sha }}-${{ github.run_attempt }}
          path: .local/portfolio-api-release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  release:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && vars.ENABLE_PORTFOLIO_API_RELEASE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: portfolio-api-production
    concurrency:
      group: portfolio-api-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          merge-multiple: true
          digest-mismatch: error
          path: .local/portfolio-api-release/
      - name: Preserve assistant settings and promote the verified API version
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.PORTFOLIO_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_RELEASE_ENABLED: ${{ vars.ENABLE_PORTFOLIO_API_RELEASE }}
          MCP_CLIENT_VERIFIED: ${{ vars.PORTFOLIO_MCP_CLIENT_VERIFIED }}
          RELEASE_ACTION: ${{ inputs.action }}
          MCP_ENABLED: ${{ inputs.mcp_enabled }}
          EXPECTED_CURRENT_MCP: ${{ inputs.expected_current_mcp }}
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: node scripts/portfolio-api/release.mjs
      - name: Check live route isolation without AI inference
        env:
          MCP_ENABLED: ${{ inputs.mcp_enabled }}
        run: node scripts/portfolio-api/smoke.mjs
